<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5, user-scalable=yes">
    <title>Jak-Lawan · Jejak Pahlawan</title>
    <style>
        /* ===== RESET & GLOBAL ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', 'Segoe UI', system-ui, -apple-system, sans-serif;
        }

        body {
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            position: fixed;
        }

        /* ===== PEMBUNGKUS UTAMA DENGAN BACKGROUND GAMBAR ===== */
        .app-container {
            position: relative;
            width: 100%;
            height: 100%;
            /* 背景图片 - 使用您提供的链接 */
            background-image: url('https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEh01d_pQxGvYrgS7-X4yiLl7WKuxG0U3u3twQQVifurwJ4VYlz0DKMaN1zx0-8hOVV4SD38WnUIbbFcoLJaLoRYIvXb34HvLSMZjejY6yOJBU4Sddef6DWrGlI1APITqf5qHidWzyVq4ac/s1600/pm.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            /* 深色半透明叠加层 */
            background-color: rgba(0, 0, 0, 0.55);
            background-blend-mode: multiply;
        }

        /* ===== PAPARAN UTAMA (HOME) ===== */
        .home-view {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow-y: auto;
            padding: 2rem 1.5rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            transition: opacity 0.3s ease;
        }

        .home-view.sembunyi {
            opacity: 0;
            pointer-events: none;
        }

        /* header responsif */
        .hero-header {
            text-align: center;
            margin-bottom: 2.5rem;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-wrap: wrap;
            gap: 0.8rem 1rem;
            text-shadow: 2px 2px 8px rgba(0,0,0,0.5);
        }

        .hero-header h1 {
            font-size: clamp(2.2rem, 8vw, 3rem);
            font-weight: 800;
            background: linear-gradient(135deg, #fbdea4, #f5c46b);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 20px #ffd966, 2px 2px 4px #00000050;
            letter-spacing: 1px;
            white-space: nowrap;
        }

        .hero-header .subtitle {
            color: #d4dba5;
            font-size: clamp(0.9rem, 4vw, 1.2rem);
            font-weight: 300;
            border-bottom: 2px dashed #b79b5b;
            padding-bottom: 0.3rem;
            display: inline-block;
            white-space: nowrap;
        }

        .reset-btn {
            background: #334e33;
            color: #fbeba4;
            padding: 0.4rem 1.2rem;
            border-radius: 40px;
            font-size: clamp(0.8rem, 3vw, 0.9rem);
            font-weight: 600;
            cursor: pointer;
            border: 2px solid #b59444;
            box-shadow: 0 5px 0 #1e3520, 0 0 15px rgba(0,0,0,0.3);
            transition: 0.08s;
            display: inline-flex;
            align-items: center;
            gap: 0.3rem;
            white-space: nowrap;
        }

        .reset-btn:active {
            transform: translateY(4px);
            box-shadow: 0 1px 0 #1e3520;
        }

        /* ===== BARIS KAD (3 atas, 2 bawah, flex tengah) ===== */
        .kad-row {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 1.5rem;
            max-width: 900px;
            width: 100%;
            margin: 0 auto;
            padding: 0.5rem;
        }

        .row-atas {
            margin-bottom: 1.5rem;
        }

        .kad-misi {
            flex: 0 1 200px;
            min-width: 160px;
            max-width: 220px;
            background: rgba(250, 246, 231, 0.9);
            backdrop-filter: blur(2px);
            border-radius: 3rem 3rem 2rem 2rem;
            padding: 1.5rem 0.5rem 1rem;
            text-align: center;
            cursor: pointer;
            transition: all 0.25s cubic-bezier(0.2, 0.9, 0.3, 1.3);
            border: 4px solid transparent;
            box-shadow: 0 20px 30px -12px #0f1f0f, 0 0 0 1px rgba(255,215,0,0.3);
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* tablet */
        @media (max-width: 700px) {
            .home-view { padding: 1.5rem 1rem; }
            .kad-row { gap: 1rem; }
            .kad-misi {
                flex: 0 1 160px;
                min-width: 140px;
                padding: 1.2rem 0.3rem 0.8rem;
            }
        }

        /* telefon kecil */
        @media (max-width: 450px) {
            .kad-misi {
                flex: 0 1 140px;
                min-width: 120px;
            }
        }

        .kad-misi.terkunci {
            opacity: 0.45;
            filter: grayscale(0.7);
            background: #a8b9a0;
            box-shadow: none;
            pointer-events: none;
            transform: scale(0.95);
        }

        .kad-misi.selesai {
            background: rgba(208, 236, 206, 0.95);
            border-color: #2d8642;
        }

        .kad-misi.semasa {
            border-color: #f5c542;
            box-shadow: 0 0 0 6px #fae073, 0 20px 30px -10px #202f1c;
            transform: translateY(-6px);
        }

        .kad-misi.buka-kunci {
            animation: pulse-glow 1s ease-out 2;
        }

        @keyframes pulse-glow {
            0% { box-shadow: 0 0 0 0 #f7d970; }
            50% { box-shadow: 0 0 0 18px #f7d97080; transform: scale(1.02); }
            100% { box-shadow: 0 0 0 0 #f7d970; }
        }

        .lambang-misi {
            width: 70px;
            height: 70px;
            background: #e7c884;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: -0.8rem auto 0.8rem;
            font-size: 2.8rem;
            border: 4px solid #b37b48;
            box-shadow: 0 8px 0 #7b572b;
        }

        .kad-misi.selesai .lambang-misi {
            background: #a5d6a5;
            border-color: #2d6e3b;
            box-shadow: 0 5px 0 #1b4f2c;
        }

        .kad-misi h2 {
            font-size: clamp(1.3rem, 4vw, 1.7rem);
            font-weight: 700;
            color: #1f4623;
            margin: 0.2rem 0;
        }

        .kad-misi p {
            font-size: clamp(0.7rem, 3vw, 0.85rem);
            font-weight: 600;
            color: #3a5f3a;
        }

        .status-badge {
            font-size: 1.4rem;
            margin-top: 0.5rem;
        }

        @media (max-width: 450px) {
            .lambang-misi {
                width: 60px;
                height: 60px;
                font-size: 2.4rem;
                margin-top: -0.5rem;
            }
        }

        /* ===== PAPARAN KOMPONEN ===== */
        .component-view {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #1e3a24;
            display: flex;
            flex-direction: column;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
            z-index: 10;
        }

        .component-view.aktif {
            opacity: 1;
            pointer-events: auto;
        }

        .component-iframe {
            width: 100%;
            height: 100%;
            border: none;
            background: white;
        }

        .btn-kembali {
            position: absolute;
            bottom: 20px;
            right: 20px;
            background: #facc6f;
            border: 3px solid #a47e3f;
            color: #1d4d1d;
            font-size: clamp(0.9rem, 4vw, 1.1rem);
            font-weight: 700;
            padding: 0.5rem 1.2rem;
            border-radius: 50px;
            box-shadow: 0 6px 0 #826424, 0 0 15px #ffe594;
            cursor: pointer;
            transition: 0.08s linear;
            z-index: 20;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            border: 2px solid #fce39c;
            white-space: nowrap;
        }

        .btn-kembali:active {
            transform: translateY(5px);
            box-shadow: 0 1px 0 #826424;
        }

        @media (max-width: 380px) {
            .btn-kembali {
                bottom: 12px;
                right: 12px;
                padding: 0.4rem 1rem;
                font-size: 0.85rem;
            }
        }

        /* ===== MODAL PILIHAN HADIAH MISTERI ===== */
        .modal-pilihan-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.65);
            backdrop-filter: blur(4px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 110;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s ease;
            padding: 1rem;
        }

        .modal-pilihan-overlay.aktif {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-pilihan-kotak {
            background: #fef7e9;
            padding: 2rem;
            border-radius: 3rem 3rem 2.5rem 2.5rem;
            text-align: center;
            width: 100%;
            max-width: 620px;
            border: 6px solid #f5c542;
            box-shadow: 0 30px 50px -20px #1e2d1e, 0 0 0 4px #fae073 inset;
            transform: scale(0.9);
            animation: pop-in 0.3s forwards;
            position: relative;
        }

        .modal-pilihan-kotak h2 {
            font-size: clamp(1.5rem, 5vw, 2.2rem);
            font-weight: 800;
            color: #d4a017;
            text-shadow: 2px 3px 0 #b57c1a;
            margin-bottom: 0.6rem;
        }

        .modal-pilihan-kotak p {
            font-size: clamp(0.9rem, 3vw, 1.05rem);
            color: #2d5a2d;
            margin-bottom: 1.5rem;
            font-weight: 500;
        }

        .modal-pilihan-butang {
            display: flex;
            justify-content: center;
            gap: 1rem;
            flex-wrap: wrap;
        }

        .modal-pilihan-btn {
            flex: 1 1 220px;
            min-height: 64px;
            background: #facc6f;
            border: 3px solid #fce39c;
            color: #1d4d1d;
            font-size: clamp(1rem, 3.5vw, 1.15rem);
            font-weight: 700;
            padding: 0.8rem 1rem;
            border-radius: 24px;
            box-shadow: 0 7px 0 #9e772e, 0 5px 15px #a48b49;
            cursor: pointer;
            transition: 0.08s linear;
        }

        .modal-pilihan-btn:hover {
            background: #ffe29a;
        }

        .modal-pilihan-btn:active {
            transform: translateY(5px);
            box-shadow: 0 2px 0 #9e772e;
        }

        .modal-pilihan-tutup {
            position: absolute;
            top: 12px;
            right: 12px;
            width: 38px;
            height: 38px;
            border-radius: 50%;
            border: 3px solid #b48c2c;
            background: #ffe3a3;
            color: #5d3b1a;
            font-size: 1.8rem;
            font-weight: 700;
            line-height: 1;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .modal-pilihan-tutup:hover {
            background: #f5c56b;
        }

        @media (max-width: 450px) {
            .modal-pilihan-kotak {
                padding: 2.5rem 1rem 1.5rem;
                border-radius: 2rem;
            }

            .modal-pilihan-butang {
                flex-direction: column;
            }

            .modal-pilihan-btn {
                flex-basis: auto;
                width: 100%;
            }
        }

        /* ===== MODAL TAHNIAH ===== */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(4px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s ease;
        }

        .modal-overlay.aktif {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-kotak {
            background: #fef7e9;
            padding: 2rem 2.5rem;
            border-radius: 4rem 4rem 3rem 3rem;
            text-align: center;
            max-width: 500px;
            width: 90%;
            border: 6px solid #f5c542;
            box-shadow: 0 30px 50px -20px #1e2d1e, 0 0 0 4px #fae073 inset;
            transform: scale(0.9);
            animation: pop-in 0.3s forwards;
        }

        @keyframes pop-in {
            to { transform: scale(1); }
        }

        .modal-kotak h2 {
            font-size: clamp(2.5rem, 8vw, 3.5rem);
            font-weight: 800;
            color: #d4a017;
            text-shadow: 2px 4px 0 #b57c1a;
            margin-bottom: 0.5rem;
            letter-spacing: 2px;
        }

        .modal-kotak p {
            font-size: clamp(1rem, 4vw, 1.2rem);
            color: #2d5a2d;
            margin: 1rem 0 2rem;
            font-weight: 500;
            background: #fff2cf;
            padding: 0.8rem 1.2rem;
            border-radius: 60px;
            border: 2px solid #eab54b;
        }

        .modal-btn {
            background: #facc6f;
            border: none;
            color: #1d4d1d;
            font-size: clamp(1.2rem, 5vw, 1.5rem);
            font-weight: 700;
            padding: 0.8rem 2.5rem;
            border-radius: 60px;
            box-shadow: 0 8px 0 #9e772e, 0 5px 20px #a48b49;
            cursor: pointer;
            transition: 0.08s linear;
            border: 3px solid #fce39c;
            display: inline-block;
            margin-top: 0.5rem;
        }

        .modal-btn:active {
            transform: translateY(6px);
            box-shadow: 0 2px 0 #9e772e;
        }

        .modal-close {
            float: right;
            font-size: 2rem;
            font-weight: 700;
            color: #5d3b1a;
            cursor: pointer;
            line-height: 1;
            margin-top: -1rem;
            margin-right: -1rem;
            background: #ffe3a3;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 3px solid #b48c2c;
        }

        .modal-close:hover {
            background: #f5c56b;
        }
    </style>
</head>
<body>
<div class="app-container">
    <!-- PAPARAN UTAMA (HOME) -->
    <div id="homeView" class="home-view">
        <div class="hero-header">
            <h1>⚔️ JAK-LAWAN</h1>
            <span class="subtitle">Jejak Pahlawan</span>
            <span class="reset-btn" id="resetProgress">↺ MULAKAN SEMULA</span>
        </div>

        <!-- baris atas (3 kad) dan baris bawah (2 kad) -->
        <div class="kad-row row-atas" id="rowAtas"></div>
        <div class="kad-row row-bawah" id="rowBawah"></div>

        <!-- MODAL PILIHAN HADIAH MISTERI -->
        <div class="modal-pilihan-overlay" id="modalPilihanHadiah">
            <div class="modal-pilihan-kotak">
                <button class="modal-pilihan-tutup" id="modalPilihanTutup" aria-label="Tutup">&times;</button>
                <h2>🎁 HADIAH MISTERI</h2>
                <p>Apakah pilihan anda, Wira?</p>
                <div class="modal-pilihan-butang">
                    <button class="modal-pilihan-btn" id="borangMaklumBalasBtn">📝 Borang Maklum Balas</button>
                    <button class="modal-pilihan-btn" id="hadiahMisteriBtn">🎁 Hadiah Misteri</button>
                </div>
            </div>
        </div>

        <!-- MODAL TAHNIAH -->
        <div class="modal-overlay" id="modalTahniah">
            <div class="modal-kotak">
                <div class="modal-close" id="modalClose">×</div>
                <h2>TAHNIAH!</h2>
                <p>Anda telah melengkapkan semua misi<br>Jejak Pahlawan dengan jayanya.</p>
                <button class="modal-btn" id="modalMainSemula">MAIN SEMULA</button>
            </div>
        </div>
    </div>

    <!-- PAPARAN KOMPONEN (FULLSCREEN IFRAME + BUTANG) -->
    <div id="componentView" class="component-view">
        <iframe id="componentIframe" class="component-iframe" 
            sandbox="allow-forms allow-scripts allow-same-origin allow-popups allow-modals allow-downloads"
            allow="fullscreen">
        </iframe>
        <button class="btn-kembali" id="kembaliBtn">🏠 ✦ SELESAI & KEMBALI</button>
    </div>
</div>

<script>
    (function() {
        // ===== DATA 5 MISI DENGAN LINK DAN TAJUK TERKINI =====
        const misi = [
            { no: 1, tajuk: 'Ujian Pra', desc: 'diagnosis awal', emoji: '📋', url: 'https://ujianpra.vercel.app/' },
            { no: 2, tajuk: 'Nota', desc: 'Peta Wira Negara', emoji: '🗺️', url: 'https://herotanahair.vercel.app/' },
            { no: 3, tajuk: 'Ujian Pos', desc: 'penilaian akhir', emoji: '📝', url: 'https://ujianpos.vercel.app/' },
            { no: 4, tajuk: 'Permainan', desc: 'kemenangan mutlak', emoji: '🎮', url: 'https://pahlawandigital.vercel.app/' }, // Link baharu
            { no: 5, tajuk: 'Hadiah Misteri', desc: '???', emoji: '🎁', url: 'https://docs.google.com/forms/d/e/1FAIpQLSer8P35MOimo2NV3TsoRhBbhVY8jZ_xsRKWvhphkta1beY3XQ/viewform?usp=header' } // Tajuk dan link baharu
        ];

        const pautanMaklumBalas = 'https://docs.google.com/forms/d/e/1FAIpQLSdRaBRFS7vZwlw7u7eKYZVXZ0LW_wMHS3lmRErWO07W6k30pw/viewform?usp=header';

        // State
        let selesai = 0;           // 0 hingga 5
        let aktifIndex = 0;         // misi yang sedang dipaparkan (0-4)
        let tunjukModal = false;    // menjadi true apabila baru capai 5
        let sedangMaklumBalas = false; // borang maklum balas tidak menamatkan misi hadiah

        // Elemen DOM
        const homeView = document.getElementById('homeView');
        const componentView = document.getElementById('componentView');
        const componentIframe = document.getElementById('componentIframe');
        const kembaliBtn = document.getElementById('kembaliBtn');
        const rowAtas = document.getElementById('rowAtas');
        const rowBawah = document.getElementById('rowBawah');
        const resetBtn = document.getElementById('resetProgress');
        const modalTahniah = document.getElementById('modalTahniah');
        const modalClose = document.getElementById('modalClose');
        const modalMainSemula = document.getElementById('modalMainSemula');
        const modalPilihanHadiah = document.getElementById('modalPilihanHadiah');
        const modalPilihanTutup = document.getElementById('modalPilihanTutup');
        const borangMaklumBalasBtn = document.getElementById('borangMaklumBalasBtn');
        const hadiahMisteriBtn = document.getElementById('hadiahMisteriBtn');

        // --- Fungsi simpan/muat localStorage ---
        function simpan() {
            localStorage.setItem('jakLawanFinal', JSON.stringify({ selesai, aktif: aktifIndex }));
        }

        function muat() {
            const data = localStorage.getItem('jakLawanFinal');
            if (data) {
                try {
                    const { selesai: s, aktif: a } = JSON.parse(data);
                    selesai = Math.min(5, Math.max(0, s));
                    aktifIndex = Math.min(4, Math.max(0, a));
                    if (selesai < 5 && aktifIndex > selesai) aktifIndex = selesai;
                } catch (e) {}
            } else {
                selesai = 0;
                aktifIndex = 0;
            }
        }

        // --- Render kad di home (pisah atas/bawah) ---
        function renderKad() {
            rowAtas.innerHTML = '';
            rowBawah.innerHTML = '';

            misi.forEach((m, idx) => {
                const kad = document.createElement('div');
                kad.className = 'kad-misi';
                kad.dataset.index = idx;

                if (idx < selesai) {
                    kad.classList.add('selesai');
                } else if (idx === selesai) {
                    if (idx === aktifIndex) kad.classList.add('semasa');
                } else {
                    kad.classList.add('terkunci');
                }

                kad.innerHTML = `
                    <div class="lambang-misi">${m.emoji}</div>
                    <h2>${m.tajuk}</h2>
                    <p>${m.desc}</p>
                    <div class="status-badge">
                        ${idx < selesai ? '✅' : (idx === selesai ? '⚔️' : '🔒')}
                    </div>
                `;

                kad.addEventListener('click', (e) => {
                    const index = parseInt(kad.dataset.index);
                    if (index <= selesai) {
                        if (index === 4) {
                            modalPilihanHadiah.classList.add('aktif');
                        } else {
                            bukaMisi(index);
                        }
                    }
                });

                // 3 atas, 2 bawah
                if (idx < 3) {
                    rowAtas.appendChild(kad);
                } else {
                    rowBawah.appendChild(kad);
                }
            });
        }

        // --- Buka misi tertentu ---
        function bukaMisi(index) {
            if (index > selesai) return;
            aktifIndex = index;
            componentIframe.src = misi[index].url;
            homeView.classList.add('sembunyi');
            componentView.classList.add('aktif');
            simpan();
        }

        // --- Tutup component dan tandai selesai jika perlu ---
        function tutupMisiDanTandai() {
            // Kembali daripada Borang Maklum Balas tidak menandakan misi selesai.
            if (sedangMaklumBalas) {
                sedangMaklumBalas = false;
                componentView.classList.remove('aktif');
                homeView.classList.remove('sembunyi');
                simpan();
                return;
            }

            let perluRender = false;
            const sebelum = selesai;
            if (selesai < 5 && aktifIndex === selesai) {
                selesai++;
                if (selesai < 5) {
                    aktifIndex = selesai;
                } else {
                    aktifIndex = 4;
                }
                perluRender = true;
            }

            componentView.classList.remove('aktif');
            homeView.classList.remove('sembunyi');

            if (perluRender) {
                renderKad();
                if (selesai > 0) {
                    const kadBaru = document.querySelector(`.kad-misi[data-index="${selesai-1}"]`);
                    if (kadBaru) {
                        kadBaru.classList.add('buka-kunci');
                        setTimeout(() => {
                            kadBaru.classList.remove('buka-kunci');
                        }, 2000);
                    }
                }
                // Jika baru capai 5, tunjuk modal
                if (sebelum < 5 && selesai === 5) {
                    tunjukModal = true;
                }
            }

            simpan();

            if (tunjukModal) {
                modalTahniah.classList.add('aktif');
                tunjukModal = false;
            }
        }

        // --- Reset progress ---
        function resetProgress() {
            selesai = 0;
            aktifIndex = 0;
            sedangMaklumBalas = false;
            componentView.classList.remove('aktif');
            homeView.classList.remove('sembunyi');
            modalTahniah.classList.remove('aktif');
            renderKad();
            simpan();
        }

        // --- Inisialisasi ---
        muat();
        renderKad();

        // --- Event listeners ---
        kembaliBtn.addEventListener('click', tutupMisiDanTandai);
        resetBtn.addEventListener('click', resetProgress);

        borangMaklumBalasBtn.addEventListener('click', () => {
            modalPilihanHadiah.classList.remove('aktif');
            sedangMaklumBalas = true;
            componentIframe.src = pautanMaklumBalas;
            homeView.classList.add('sembunyi');
            componentView.classList.add('aktif');
            simpan();
        });

        hadiahMisteriBtn.addEventListener('click', () => {
            modalPilihanHadiah.classList.remove('aktif');
            sedangMaklumBalas = false;
            bukaMisi(4);
        });

        modalPilihanTutup.addEventListener('click', () => {
            modalPilihanHadiah.classList.remove('aktif');
        });

        modalPilihanHadiah.addEventListener('click', (e) => {
            if (e.target === modalPilihanHadiah) {
                modalPilihanHadiah.classList.remove('aktif');
            }
        });
        modalClose.addEventListener('click', () => {
            modalTahniah.classList.remove('aktif');
        });
        modalMainSemula.addEventListener('click', () => {
            resetProgress();
        });
        modalTahniah.addEventListener('click', (e) => {
            if (e.target === modalTahniah) {
                modalTahniah.classList.remove('aktif');
            }
        });
    })();
</script>
</body>
</html>
